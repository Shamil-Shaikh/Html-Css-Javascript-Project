<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0">

  <title>Dev Quote Generator</title>

  <link rel="stylesheet"
        href="style.css">
</head>
<body>

<div class="container">

  <h1>Dev Quotes 💻</h1>

  <div class="quote-box">

    <p id="quote">
      Click below to generate quote
    </p>

  </div>

  <button onclick="getQuote()">
    New Quote
  </button>

  <button onclick="copyQuote()">
    Copy
  </button>

</div>

<script src="script.js"></script>
</body>
</html>
