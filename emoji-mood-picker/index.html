<!DOCTYPE html>
<html>
<head>
  <title>Emoji Mood Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>How Are You Feeling Today?</h1>

  <div class="emojis">
    <span onclick="setMood('happy')">😊</span>
    <span onclick="setMood('cool')">😎</span>
    <span onclick="setMood('sad')">😢</span>
    <span onclick="setMood('angry')">😡</span>
  </div>

  <h2 id="message">
    Select Your Mood
  </h2>

</div>

<script src="script.js"></script>

</body>
</html>
